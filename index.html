<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heladería y Congelados — Hacé tu pedido</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="publico">

<header class="barra barra-publica no-print">
  <div class="barra-top">
    <div class="marca">
      <span class="marca-icono" aria-hidden="true">❄</span>
      <span class="marca-texto">Heladería y Congelados</span>
    </div>
    <span class="etiqueta-demo">MODO DEMO</span>
      <span id="conexion" class="chapa-conexion conectando">Conectando…</span>
  </div>
</header>

<main id="app" class="app"></main>

<div id="avisos" class="avisos no-print" aria-live="polite"></div>

<div id="modal" class="modal oculto no-print" role="dialog" aria-modal="true">
  <div class="modal-caja">
    <h3 id="modal-titulo"></h3>
    <div id="modal-cuerpo"></div>
    <div class="modal-acciones">
      <button type="button" class="btn btn-suave" id="modal-cancelar">Volver</button>
      <button type="button" class="btn btn-peligro" id="modal-aceptar">Confirmar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script src="pedido.js"></script>
</body>
</html>
